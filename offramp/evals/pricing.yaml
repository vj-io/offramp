# USD prices per 1M tokens (standard tier: no batch, no prompt-cache discounts).
# Every entry carries its own `as_of` date (when the value was recorded), a `source` URL (PRD §6.5) and a
# `price_status`:
#   published              - read from the vendor's own price page (or price API) on `as_of`.
#   unverified-list-price  - a list price taken from the PRD/brief that could not be read from the source page;
#                            a UI or PR must show it as unverified.
# `tier` marks Token Factory models: offramp/tf/tiers.py reads TF prices by tier, so overriding a model id
# via OFFRAMP_MODEL_* keeps the tier price. A run reads these live from the Token Factory model API
# (offramp/tf/prices.py, cached per day) and falls back to the entries here, labelled as a fallback.
models:
  # --- Nebius Token Factory (Nemotron). Model ids confirmed via GET /v1/models (docs/plan/tf-probe.md). ---
  # Prices: GET /v1/models?verbose=true on 2026-10-21, `pricing.prompt` / `pricing.completion` in USD per
  # token (x 1e6 here). The console price page needs a login, so it is not the source.
  nvidia/Nemotron-3-Ultra-550b-a55b:
    tier: ultra
    input_usd_per_m: 1.00
    output_usd_per_m: 3.00
    as_of: "2026-10-21"
    source: https://api.tokenfactory.nebius.com/v1/models?verbose=true
    price_status: published
  nvidia/nemotron-3-super-120b-a12b:
    tier: super
    input_usd_per_m: 0.30
    output_usd_per_m: 0.90
    as_of: "2026-10-21"
    source: https://api.tokenfactory.nebius.com/v1/models?verbose=true
    price_status: published
  nvidia/Nemotron-3_5-Lightning:
    tier: lightning
    input_usd_per_m: 0.06
    output_usd_per_m: 0.24
    as_of: "2026-10-21"
    source: https://api.tokenfactory.nebius.com/v1/models?verbose=true
    price_status: published

