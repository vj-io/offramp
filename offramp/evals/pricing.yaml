# Published USD prices per 1M tokens (standard tier: no batch, no prompt-cache discounts).
# Every entry carries its own `as_of` date and `source` URL (PRD §6.5). `tier` marks Token Factory models:
# offramp/tf/tiers.py reads TF prices by tier, so overriding a model id via OFFRAMP_MODEL_* keeps the tier price.
models:
  # --- Nebius Token Factory (Nemotron) ---
  nvidia/Nemotron-3-Ultra-550b-a55b:
    tier: ultra
    input_usd_per_m: 1.00
    output_usd_per_m: 3.00
    as_of: "2026-10-19"
    source: https://nebius.com/token-factory/prices
    note: "Price from PRD §1; the Nebius price page was not machine-readable on as_of, re-check in Task 14."
  nvidia/nemotron-3-super-120b-a12b:
    tier: super
    input_usd_per_m: 0.30
    output_usd_per_m: 0.90
    as_of: "2026-10-19"
    source: https://nebius.com/token-factory/prices
    note: "Matches PRD §1; also listed at $0.30/$0.90 for Nebius by Artificial Analysis (artificialanalysis.ai)."
  nvidia/Nemotron-3_5-Lightning:
    tier: lightning
    input_usd_per_m: 0.06
    output_usd_per_m: 0.24
    as_of: "2026-10-19"
    source: https://nebius.com/token-factory/prices
    note: "Price from PRD §1; the Nebius price page was not machine-readable on as_of, re-check in Task 14."

