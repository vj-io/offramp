[project]
name = "offramp"
version = "0.1.0"
description = "Prove which closed-LLM call sites NVIDIA Nemotron on Nebius Token Factory can take over, and open the PR."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "openai>=1.50",
  "pydantic>=2.7",
  "sqlmodel>=0.0.22",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
baseline = ["anthropic>=0.40"]
tracing = ["langsmith>=0.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "anthropic>=0.40", "langsmith>=0.2"]

[project.scripts]
offramp = "offramp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offramp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: re-records against real Token Factory; only runs with --live"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
